name: Bug report
description: Report incorrect parsing, an exception, or a platform-specific failure.
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose a possible security vulnerability here. Use the private process in SECURITY.md.
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include the exact input bytes, target type, indices, and keywords.
      render: julia
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include the value, exception, or return code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: State the expected result and the oracle or specification used.
    validations:
      required: true
  - type: input
    id: parsers-version
    attributes:
      label: Parsers version or commit
      placeholder: "3.0.0 or a full commit SHA"
    validations:
      required: true
  - type: input
    id: julia-version
    attributes:
      label: Julia version
      placeholder: "Output of VERSION"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "OS, architecture, and Sys.WORD_SIZE"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add related issues, regressions, or downstream impact.
