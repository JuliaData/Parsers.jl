name: IntegrationTest

on:
  push:
    branches:
      - main
      - v3
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package.repo }} - allow incompatible ${{ matrix.package.allow_incompatible }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          # NanoDates supports Parsers 3. Its test suite must actually run.
          - {user: JuliaTime, repo: NanoDates.jl, allow_incompatible: false}
          # These default branches still cap Parsers below 3. A resolver failure
          # is an expected SemVer guard until each downstream package migrates.
          - {user: JuliaData, repo: CSV.jl, allow_incompatible: true}
          - {user: JuliaData, repo: WeakRefStrings.jl, allow_incompatible: true}
          - {user: JuliaIO, repo: JSON.jl, allow_incompatible: true}
          - {user: JuliaStrings, repo: InlineStrings.jl, allow_incompatible: true}
          - {user: nickrobinson251, repo: PowerFlowData.jl, allow_incompatible: true}
          - {user: quinnj, repo: JSON3.jl, allow_incompatible: true}
          - {user: RelationalAI, repo: ChunkedCSV.jl, allow_incompatible: true}
          - {user: cjdoris, repo: ARFFFiles.jl, allow_incompatible: true}
    steps:
      - name: Check out Parsers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"
          arch: x64
      - name: Check out downstream package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
          persist-credentials: false
      - name: Test downstream package
        env:
          ALLOW_INCOMPATIBLE: ${{ matrix.package.allow_incompatible }}
          DOWNSTREAM_REPO: ${{ matrix.package.repo }}
        shell: julia --project=downstream --color=yes {0}
        run: |
          using Pkg

          allow_incompatible = lowercase(ENV["ALLOW_INCOMPATIBLE"]) == "true"
          try
              Pkg.develop(PackageSpec(path=pwd()))
              if ENV["DOWNSTREAM_REPO"] == "ARFFFiles.jl"
                  # ARFFFiles constructs Tables.DictColumnTable from unordered
                  # Dicts. OrderedCollections 2 rejects those inputs.
                  Pkg.add(PackageSpec(name="OrderedCollections", version="1"))
              end
              Pkg.resolve()
              Pkg.test()
          catch err
              if err isa Pkg.Resolve.ResolverError && allow_incompatible
                  @info "SKIPPED: downstream compat excludes Parsers 3" package=ENV["DOWNSTREAM_REPO"] exception=err
              else
                  rethrow()
              end
          end
