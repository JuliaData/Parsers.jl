name: IntegrationTest

on:
  push:
    branches:
      - main
      - v3
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package.repo }} - Parsers 3 compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package:
          - {user: JuliaTime, repo: NanoDates.jl}
          - {user: JuliaData, repo: CSV.jl}
          - {user: JuliaData, repo: WeakRefStrings.jl}
          - {user: JuliaIO, repo: JSON.jl}
          - {user: JuliaStrings, repo: InlineStrings.jl}
          - {user: nickrobinson251, repo: PowerFlowData.jl}
          - {user: quinnj, repo: JSON3.jl}
          - {user: RelationalAI, repo: ChunkedCSV.jl}
          - {user: cjdoris, repo: ARFFFiles.jl}
    steps:
      - name: Check out Parsers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"
          arch: x64
      - name: Check out downstream package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
          persist-credentials: false
      - name: Check declared compatibility
        id: compatibility
        env:
          DOWNSTREAM_REPO: ${{ matrix.package.repo }}
        shell: julia --project=downstream --color=yes {0}
        run: |
          using Pkg

          package_project = Pkg.TOML.parsefile("Project.toml")
          downstream_project = Pkg.TOML.parsefile(joinpath("downstream", "Project.toml"))
          parsers_version = VersionNumber(package_project["version"])
          parsers_compat = get(get(downstream_project, "compat", Dict{String, Any}()),
                               "Parsers", nothing)
          supported = parsers_compat === nothing ||
                      parsers_version in Pkg.Types.semver_spec(parsers_compat)
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "supported=", supported)
          end
          package = ENV["DOWNSTREAM_REPO"]
          if supported
              @info "Declared compatibility allows the downstream test" package parsers_version parsers_compat
          else
              @info "Downstream test skipped: declared Parsers compat excludes this version" package parsers_version parsers_compat
              open(ENV["GITHUB_STEP_SUMMARY"], "a") do io
                  println(io, "### Declared compatibility skip")
                  println(io, "`$package` declares `Parsers = ", repr(parsers_compat),
                          "`, which excludes `$parsers_version`. The test step is skipped.")
              end
          end

      - name: Test downstream package
        if: steps.compatibility.outputs.supported == 'true'
        shell: julia --project=downstream --color=yes {0}
        run: |
          using Pkg

          # From here onward every resolver or test failure is real. Do not
          # convert an unrelated ResolverError into a successful job.
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.resolve()
          Pkg.test()
